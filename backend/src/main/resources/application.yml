# Credenciales por variables de entorno (en Render) o, en local, desde backend/.env
# (no se versiona; ver .env.example).
spring:
  application:
    name: thpc-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # thpc_api tiene un limite de 10 conexiones. Con 3 por instancia, un deploy (version
      # vieja + nueva = 6) deja margen; el catalogo vive en memoria, asi que 3 sobran.
      maximum-pool-size: 3
  jpa:
    # El esquema lo definen las migraciones de supabase/migrations: Hibernate solo
    # comprueba que las entidades calcen con las tablas, nunca las crea ni altera.
    hibernate:
      ddl-auto: validate
    open-in-view: false

thpc:
  # Igual que MANUAL_ONLY_STORES en scraper/src/manual_stores.py.
  manual-stores:
    - UpDown
  # Separados por coma. En Render: CORS_ALLOWED_ORIGINS con el dominio del frontend.
  # 5173 = npm run dev, 4173 = npm run preview.
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  # Bot de Telegram. Vacios en local si no se prueba el bot: el webhook rechaza todo.
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}

# Documentacion de la API: /swagger-ui.html (pagina) y /v3/api-docs (JSON OpenAPI).
# Solo /api/**: quedan fuera el actuator y el webhook de Telegram (que ademas es @Hidden).
springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    try-it-out-enabled: true

server:
  # Render asigna el puerto en la variable PORT.
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
