name: CI scraper

# Pruebas del scraper y el matching en cada cambio de scraper/ (push a main o PR).
on:
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/ci-scraper.yml"]
  pull_request:
    paths: ["scraper/**", ".github/workflows/ci-scraper.yml"]

permissions:
  contents: read

# Un push nuevo cancela la corrida anterior de la misma rama: solo importa la ultima.
concurrency:
  group: ci-scraper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scraper/requirements*.txt

      # Las pruebas no calculan embeddings: se instala todo menos sentence-transformers,
      # que arrastra PyTorch (~800 MB) y alargaria cada corrida varios minutos.
      - name: Instalar dependencias (sin sentence-transformers)
        run: |
          grep -v '^sentence-transformers' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt pytest==8.3.4

      - name: Pruebas
        run: python -m pytest -q
