name: Poll Telegram bot commands

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      # Solo las dependencias minimas que usa este script (no todo
      # requirements.txt): esto corre seguido (programado cada 15 min), no tiene sentido
      # instalar sentence-transformers/torch en cada corrida.
      - name: Install dependencies
        run: pip install requests==2.32.3 python-dotenv==1.0.1 psycopg2-binary==2.9.10

      - name: Poll Telegram commands
        run: python -m src.poll_telegram_commands

      # Aviso solo al mantenedor cuando una tienda de actualizacion manual
      # (UpDown) esta por cumplir el plazo de 72 h. Va aparte del polling para
      # que un fallo del bot no impida el aviso, y al reves.
      - name: Alert about stale manual stores
        if: always()
        run: python -m src.alert_manual_stores
