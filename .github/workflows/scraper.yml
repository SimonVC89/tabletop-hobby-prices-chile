name: Scrape and match board game prices

on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC = ~06:00 Chile (hora estandar)
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Evita re-descargar el modelo de Hugging Face en cada corrida: sin
      # esto, el runner golpea la API de HF desde una IP de datacenter
      # compartida y puede recibir 429 (rate limit) en una VM limpia sin cache.
      - name: Cache modelo de sentence-transformers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-paraphrase-multilingual-MiniLM-L12-v2

      # Cada tienda es un step independiente con continue-on-error: si una
      # tienda cambia su HTML y su scraper falla, no debe tumbar a las
      # demas ni impedir que corra el matching con lo que si se pudo traer.
      #
      # UpDown y PlanetaLoz quedan fuera del cron: ambas devuelven 403
      # Forbidden especificamente desde las IPs de los runners de GitHub
      # (probablemente un bloqueo a trafico de datacenter/fuera de Chile),
      # aunque funcionan sin problema corridas manualmente. No se intenta
      # evadir ese bloqueo (ver "Scraping responsable" en el README); sus
      # scripts de ingesta siguen disponibles para correr en local.
      - name: Scrape La Loseta
        id: laloseta
        continue-on-error: true
        run: python -m src.ingest_laloseta

      - name: Scrape DeMente Games
        id: dementegames
        continue-on-error: true
        run: python -m src.ingest_dementegames

      - name: Scrape VuduGaming
        id: vudugaming
        continue-on-error: true
        run: python -m src.ingest_vudugaming

      - name: Scrape Griffin Games
        id: griffingames
        continue-on-error: true
        run: python -m src.ingest_griffingames

      - name: Scrape Aldea Juegos
        id: aldeajuegos
        continue-on-error: true
        run: python -m src.ingest_aldeajuegos

      - name: Scrape Mana House
        id: manahouse
        continue-on-error: true
        run: python -m src.ingest_manahouse

      - name: Scrape Cafe 2d6
        id: cafe2d6
        continue-on-error: true
        run: python -m src.ingest_cafe2d6

      - name: Scrape El Patio Geek
        id: elpatiogeek
        continue-on-error: true
        run: python -m src.ingest_elpatiogeek

      - name: Scrape Wargaming
        id: wargaming
        continue-on-error: true
        run: python -m src.ingest_wargaming

      - name: Compute match keys
        run: python -m src.matching.compute_keys

      - name: Compute embeddings
        run: python -m src.compute_embeddings

      - name: Assign products
        run: python -m src.matching.assign_products

      # Si alguna tienda fallo, el job completo se marca como fallido
      # (dispara el email de GitHub) aunque el resto si se haya procesado.
      - name: Check for store failures
        if: always()
        run: |
          failed=0
          for outcome in \
            "${{ steps.laloseta.outcome }}" \
            "${{ steps.dementegames.outcome }}" \
            "${{ steps.vudugaming.outcome }}" \
            "${{ steps.griffingames.outcome }}" \
            "${{ steps.aldeajuegos.outcome }}" \
            "${{ steps.manahouse.outcome }}" \
            "${{ steps.cafe2d6.outcome }}" \
            "${{ steps.elpatiogeek.outcome }}" \
            "${{ steps.wargaming.outcome }}"; do
            if [ "$outcome" != "success" ]; then
              echo "::warning::Un scraper de tienda fallo (outcome=$outcome)"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
