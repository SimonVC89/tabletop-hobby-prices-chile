name: Scrape and match board game prices

# Lo lanza cron-job.org a las 05:17 y 19:17 hora de Chile (zona America/Santiago, asi
# que sigue el cambio de horario solo), con un POST a la API de GitHub (workflow_dispatch)
# y un token que solo puede lanzar workflows de este repositorio. El "schedule" de
# GitHub se dejo de usar porque las arrancaba con 3 a 7 horas de atraso.
# - 05:17: captura los cambios de la jornada anterior y las ofertas programadas a
#   medianoche.
# - 19:17: justo despues del horario laboral (8-18 h), cuando las tiendas ya cambiaron
#   sus precios del dia.
# Guardar solo cambios en price_history (db.insert_price_history) es lo que permite
# scrapear dos veces al dia sin que la base crezca el doble.
on:
  workflow_dispatch: {}

# Si una corrida se atrasa y se junta con la siguiente, esperan en fila en vez de
# pisarse (dos corridas escribiendo a la vez duplicarian trabajo y avisos).
concurrency:
  group: scrape-and-match
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Evita re-descargar el modelo de Hugging Face en cada corrida: sin
      # esto, el runner golpea la API de HF desde una IP de datacenter
      # compartida y puede recibir 429 (rate limit) en una VM limpia sin cache.
      - name: Cache modelo de sentence-transformers
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-paraphrase-multilingual-MiniLM-L12-v2

      # Cada tienda es un step independiente con continue-on-error: si una
      # tienda cambia su HTML y su scraper falla, no debe tumbar a las
      # demas ni impedir que corra el matching con lo que si se pudo traer.
      #
      # UpDown queda fuera del cron: devuelve 403 Forbidden especificamente
      # desde las IPs de los runners de GitHub (bloqueo a trafico de
      # datacenter), aunque funciona sin problema corrida manualmente desde
      # una conexion residencial. No se intenta evadir ese bloqueo (ver
      # "Scraping responsable" en el README).
      - name: Scrape La Loseta
        id: laloseta
        continue-on-error: true
        run: python -m src.ingest_laloseta

      - name: Scrape DeMente Games
        id: dementegames
        continue-on-error: true
        run: python -m src.ingest_dementegames

      - name: Scrape VuduGaming
        id: vudugaming
        continue-on-error: true
        run: python -m src.ingest_vudugaming

      - name: Scrape Griffin Games
        id: griffingames
        continue-on-error: true
        run: python -m src.ingest_griffingames

      - name: Scrape Aldea Juegos
        id: aldeajuegos
        continue-on-error: true
        run: python -m src.ingest_aldeajuegos

      - name: Scrape Mana House
        id: manahouse
        continue-on-error: true
        run: python -m src.ingest_manahouse

      - name: Scrape Café 2d6
        id: cafe2d6
        continue-on-error: true
        run: python -m src.ingest_cafe2d6

      - name: Scrape El Patio Geek
        id: elpatiogeek
        continue-on-error: true
        run: python -m src.ingest_elpatiogeek

      - name: Scrape Wargaming
        id: wargaming
        continue-on-error: true
        run: python -m src.ingest_wargaming

      - name: Scrape Diverti
        id: diverti
        continue-on-error: true
        run: python -m src.ingest_diverti

      - name: Scrape Piedra Bruja
        id: piedrabruja
        continue-on-error: true
        run: python -m src.ingest_piedrabruja

      - name: Scrape Jugones
        id: jugones
        continue-on-error: true
        run: python -m src.ingest_jugones

      # Si el sitio de una tienda estaba caido, se reintenta despues de esperar 2 y 5
      # min, cuando las demas ya terminaron (src/retry_failed_stores.py). Va antes del
      # matching para que lo recuperado entre en esta misma corrida.
      - name: Retry failed stores
        id: retry_stores
        if: always()
        continue-on-error: true
        env:
          STORE_OUTCOMES: |
            src.ingest_laloseta=${{ steps.laloseta.outcome }}
            src.ingest_dementegames=${{ steps.dementegames.outcome }}
            src.ingest_vudugaming=${{ steps.vudugaming.outcome }}
            src.ingest_griffingames=${{ steps.griffingames.outcome }}
            src.ingest_aldeajuegos=${{ steps.aldeajuegos.outcome }}
            src.ingest_manahouse=${{ steps.manahouse.outcome }}
            src.ingest_cafe2d6=${{ steps.cafe2d6.outcome }}
            src.ingest_elpatiogeek=${{ steps.elpatiogeek.outcome }}
            src.ingest_wargaming=${{ steps.wargaming.outcome }}
            src.ingest_diverti=${{ steps.diverti.outcome }}
            src.ingest_piedrabruja=${{ steps.piedrabruja.outcome }}
            src.ingest_jugones=${{ steps.jugones.outcome }}
        run: python -m src.retry_failed_stores

      - name: Compute match keys
        run: python -m src.matching.compute_keys

      - name: Compute embeddings
        run: python -m src.compute_embeddings

      - name: Assign products
        run: python -m src.matching.assign_products

      - name: Choose display names
        run: python -m src.matching.display_names

      # Descripcion corta de los productos nuevos (el catalogo de cada tienda
      # solo trae el titulo). Tope por corrida: si hay mas, siguen otro dia.
      # UpDown bloquea a GitHub; su pagina solo se pide corriendolo a mano.
      # No es critico: si falla, no tumba el resto del pipeline.
      - name: Fetch missing descriptions
        continue-on-error: true
        run: python -m src.fetch_descriptions --limit 150 --skip-stores UpDown

      - name: Classify products
        run: python -m src.matching.classify

      - name: Mark stale listings
        run: python -m src.mark_stale_listings

      - name: Hide discontinued products
        run: python -m src.hide_discontinued_products

      - name: Prune old price history
        run: python -m src.prune_price_history

      - name: Refresh price reference views
        run: python -m src.refresh_price_views

      - name: Send Telegram digest
        run: python -m src.send_telegram_digest

      # Si una tienda lleva dos corridas seguidas sin poder leerse, el job completo se
      # marca como fallido (dispara el email de GitHub) aunque el resto si se haya
      # procesado. Una caida que se recupero al reintentar no cuenta, y una tienda que
      # falla en una sola corrida queda como advertencia (src/retry_failed_stores.py).
      - name: Check for store failures
        if: always()
        run: |
          if [ "${{ steps.retry_stores.outcome }}" != "success" ]; then
            echo "::error::Al menos una tienda lleva dos corridas seguidas sin poder leerse (ver el paso Retry failed stores)"
            exit 1
          fi
