name: Alert about stale manual stores

# Aviso solo al mantenedor cuando una tienda de actualizacion manual (UpDown) esta
# por cumplir el plazo de 72 h sin actualizarse (24, 12 y 2 h antes).
#
# Antes este workflow tambien leia los comandos del bot (getUpdates); desde que la
# API recibe los mensajes por webhook eso ya no corre aqui (y Telegram no permite
# getUpdates con un webhook activo).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      # Solo las dependencias minimas del script (no todo requirements.txt).
      - name: Install dependencies
        run: pip install requests==2.32.3 python-dotenv==1.0.1 psycopg2-binary==2.9.10

      - name: Alert about stale manual stores
        run: python -m src.alert_manual_stores
